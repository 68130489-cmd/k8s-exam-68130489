<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal | ID-489</title>
<style>
* {box-sizing:border-box}
body {
    margin:0;
    background:#0f172a;
    font-family:Arial,sans-serif;
    color:white;
}
.container {
    max-width:1000px;
    margin:50px auto;
    padding:30px;
}
h1 {
    color:#38bdf8;
    font-size:36px;
}
.panel {
    background:#1e293b;
    padding:30px;
    border-radius:16px;
    border:1px solid #334155;
}
textarea {
    width:100%;
    min-height:450px;
    background:#0f172a;
    color:white;
    border:1px solid #475569;
    border-radius:10px;
    padding:20px;
    font-size:16px;
    font-family:Arial,sans-serif;
    line-height:1.8;
    resize:vertical;
}
button {
    background:#059669;
    color:white;
    border:0;
    padding:14px 30px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
}
a {
    display:inline-block;
    background:#0284c7;
    color:white;
    padding:14px 25px;
    border-radius:8px;
    text-decoration:none;
    margin-top:20px;
}
.success {
    background:#064e3b;
    color:#6ee7b7;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}
</style>
</head>
<body>
<main class="container">
    <h1>Admin Portal</h1>
    <p>Research Content Management | ID-489</p>

    <div class="panel">
        <h2>แก้ไขข้อมูลสรุปงานวิจัย</h2>

        {% if saved %}
        <div class="success">
            บันทึกข้อมูลสำเร็จ
        </div>
        {% endif %}

        <form method="POST" action="/edit">
            <textarea name="content" required>{{ content }}</textarea>
            <button type="submit">บันทึกข้อมูล</button>
            <a href="http://www.id-489.com/research">
                ดูหน้างานวิจัย
            </a>
        </form>
    </div>
</main>
</body>
</html>
