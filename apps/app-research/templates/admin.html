
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal | ID-489</title>
<style>
* {box-sizing: border-box}
body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}
.container {
    max-width: 900px;
    margin: 70px auto;
    padding: 30px;
}
h1 {color: #38bdf8; font-size: 38px}
.subtitle {color: #94a3b8}
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    margin-top: 35px;
}
.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 35px;
    text-align: center;
}
.card h2 {color: #38bdf8}
.card p {color: #cbd5e1}
.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 24px;
    background: #0284c7;
    color: white;
    border-radius: 8px;
    text-decoration: none;
}
@media(max-width: 600px) {
    .grid {grid-template-columns: 1fr}
}
</style>
</head>
<body>
<main class="container">
    <h1>Admin Portal</h1>
    <p class="subtitle">
        Kubernetes Content Management | ID-489
    </p>

    <div class="grid">
        <div class="card">
            <h2>Student Portal</h2>
            <p>จัดการข้อมูลนักศึกษา</p>
            <a class="btn" href="/edit-portal">
                แก้ไข Student Portal
            </a>
        </div>

        <div class="card">
            <h2>Research</h2>
            <p>จัดการเนื้อหาสรุปงานวิจัย</p>
            <a class="btn" href="/edit">
                แก้ไข Research
            </a>
        </div>
    </div>
</main>
</body>
</html>
