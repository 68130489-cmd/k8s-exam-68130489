apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-489
  namespace: id-489
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portal-489
  template:
    metadata:
      labels:
        app: portal-489
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: portal-489
              topologyKey: kubernetes.io/hostname
      containers:
        - name: portal
          image: localhost/portal-489:1.2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-portal
  namespace: id-489
spec:
  type: ClusterIP
  selector:
    app: portal-489
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
