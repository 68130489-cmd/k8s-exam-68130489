apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-489
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: app-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: app-api
          image: localhost/app-api:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api
  namespace: id-489
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
