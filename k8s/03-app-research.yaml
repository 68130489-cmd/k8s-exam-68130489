apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-research
  namespace: id-489
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-research
  template:
    metadata:
      labels:
        app: app-research
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: app-research
          image: localhost/app-research:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /research
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: research-storage
              mountPath: /data
      volumes:
        - name: research-storage
          persistentVolumeClaim:
            claimName: research-pvc-489
---
apiVersion: v1
kind: Service
metadata:
  name: svc-research
  namespace: id-489
spec:
  type: ClusterIP
  selector:
    app: app-research
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
